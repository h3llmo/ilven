# Ilven platform. Runs with nothing but the right to start Docker: no bind mounts, no docker.sock, no host scripts.
# Integrations are pulled in below; removing one = removing its line. The platform never depends on them.
# Works with no .env at all: every setting has a default here (dev: Keycloak from compose.override.yaml, loaded
# automatically). A deployment puts its own settings in an untracked .env (see .env.example).
name: ilven
include:
  - integrations/pilot/compose.yaml
  - integrations/locke-vault/compose.yaml

x-hardening: &hardening
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-auth-env: &auth-env
  ILVEN_AUTH_MODE: ${ILVEN_AUTH_MODE:-oidc}
  OIDC_ISSUER: ${ILVEN_OIDC_ISSUER:-${ILVEN_AUTH_URL:-http://localhost:8080/auth}/realms/ilven}
  OIDC_JWKS_URL: ${ILVEN_OIDC_JWKS_URL:-http://keycloak:8080/auth/realms/ilven/protocol/openid-connect/certs}
  OIDC_AUDIENCE: ilven
  CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
  CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
  ILVEN_ADMIN_EMAILS: ${ILVEN_ADMIN_EMAILS:-}

x-pg: &pg
  image: postgres:16-alpine
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 3s
    timeout: 3s
    retries: 30

x-node-health: &node-health
  test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
  interval: 5s
  timeout: 3s
  retries: 30

services:
  # Generates every platform secret on first start into a Docker volume. Services mount only the subdirectories they need.
  secrets-init:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    volumes: [secrets:/secrets]
    command:
      - sh
      - -euc
      - |
        umask 022
        gen() { d=/secrets/$$1; mkdir -p "$$d"; if [ ! -s "$$d/$$2" ]; then head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$d/$$2"; echo "generated $$1/$$2"; fi; chmod 0444 "$$d/$$2"; }
        gen nevli-db password
        gen dms-db password
        gen keycloak-db password
        gen keycloak admin_password
        gen nevli master_key
        gen internal token
        gen ai confirm_key
        gen keycloak-users admin
        gen keycloak-users alice
        gen garage rpc_secret
        gen garage admin_token

  gateway:
    build: { context: ., target: gateway }
    restart: unless-stopped
    ports: ["${ILVEN_HTTP_PORT:-8080}:80"]
    environment:
      ILVEN_AUTH_MODE: ${ILVEN_AUTH_MODE:-oidc}
      ILVEN_OIDC_ISSUER: ${ILVEN_OIDC_ISSUER:-${ILVEN_AUTH_URL:-http://localhost:8080/auth}/realms/ilven}
      ILVEN_OIDC_CLIENT_ID: ${ILVEN_OIDC_CLIENT_ID:-ilven-web}
    volumes: [gateway-data:/data, gateway-config:/config]

  nevli-db:
    <<: *pg
    environment:
      POSTGRES_DB: nevli
      POSTGRES_USER: nevli
      POSTGRES_PASSWORD_FILE: /run/ilven-secrets/db/password
    volumes:
      - nevli-db-data:/var/lib/postgresql/data
      - { type: volume, source: secrets, target: /run/ilven-secrets/db, read_only: true, volume: { subpath: nevli-db } }
    networks: [nevli-db]
    depends_on: { secrets-init: { condition: service_completed_successfully } }

  nevli:
    <<: *hardening
    build: { context: ., target: nevli }
    environment:
      <<: *auth-env
      DB_HOST: nevli-db
      DB_NAME: nevli
      DB_USER: nevli
      DB_PASSWORD_FILE: /run/ilven-secrets/db/password
      NEVLI_MASTER_KEY_FILE: /run/ilven-secrets/nevli/master_key
      ILVEN_INTERNAL_TOKEN_FILE: /run/ilven-secrets/internal/token
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-ilven}
      # Object storage for apps: Nevli alone holds the admin token and hands each registered app its own bucket.
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN_FILE: /run/ilven-secrets/garage/admin_token
      GARAGE_S3_URL: http://garage:3900
      GARAGE_CAPACITY_BYTES: ${GARAGE_CAPACITY_BYTES:-21474836480}
    volumes:
      - { type: volume, source: secrets, target: /run/ilven-secrets/garage, read_only: true, volume: { subpath: garage } }
      - { type: volume, source: secrets, target: /run/ilven-secrets/db, read_only: true, volume: { subpath: nevli-db } }
      - { type: volume, source: secrets, target: /run/ilven-secrets/nevli, read_only: true, volume: { subpath: nevli } }
      - { type: volume, source: secrets, target: /run/ilven-secrets/internal, read_only: true, volume: { subpath: internal } }
    networks: [default, nevli-db]
    healthcheck: *node-health
    depends_on:
      secrets-init: { condition: service_completed_successfully }
      nevli-db: { condition: service_healthy }

  ilven-ai:
    <<: *hardening
    build: { context: ., target: ilven-ai }
    environment:
      <<: *auth-env
      NEVLI_INTERNAL_URL: http://nevli:3001
      ILVEN_INTERNAL_TOKEN_FILE: /run/ilven-secrets/internal/token
      ILVEN_AI_CONFIRM_KEY_FILE: /run/ilven-secrets/ai/confirm_key
    volumes:
      - { type: volume, source: secrets, target: /run/ilven-secrets/internal, read_only: true, volume: { subpath: internal } }
      - { type: volume, source: secrets, target: /run/ilven-secrets/ai, read_only: true, volume: { subpath: ai } }
    healthcheck: *node-health
    depends_on:
      secrets-init: { condition: service_completed_successfully }

  nevli-dms-db:
    <<: *pg
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD_FILE: /run/ilven-secrets/db/password
    volumes:
      - dms-db-data:/var/lib/postgresql/data
      - { type: volume, source: secrets, target: /run/ilven-secrets/db, read_only: true, volume: { subpath: dms-db } }
    networks: [dms-db]
    depends_on: { secrets-init: { condition: service_completed_successfully } }

  nevli-dms:
    <<: *hardening
    build: { context: ., target: nevli-dms }
    user: "1000:1000"
    environment:
      <<: *auth-env
      DB_HOST: nevli-dms-db
      DB_NAME: dms
      DB_USER: dms
      DB_PASSWORD_FILE: /run/ilven-secrets/db/password
      NEVLI_INTERNAL_URL: http://nevli:3001
      DMS_DATA_DIR: /data
    volumes:
      - dms-data:/data
      - { type: volume, source: secrets, target: /run/ilven-secrets/db, read_only: true, volume: { subpath: dms-db } }
    networks: [default, dms-db]
    healthcheck: *node-health
    depends_on:
      dms-volume-init: { condition: service_completed_successfully }
      nevli-dms-db: { condition: service_healthy }

  # Object storage (Garage, S3-compatible) for apps' binaries. Apps reach the S3 API (:3900) with the bucket-scoped key
  # Nevli gives them; the admin API (:3903) needs the admin token, which only Nevli has.
  garage:
    <<: *hardening
    build: { context: ., target: garage }
    init: false
    user: "1000:1000"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - { type: volume, source: secrets, target: /run/garage-secrets, read_only: true, volume: { subpath: garage } }
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      secrets-init: { condition: service_completed_successfully }
      garage-volume-init: { condition: service_completed_successfully }

  garage-volume-init:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    volumes: [garage-meta:/meta, garage-data:/data]
    command: ["sh", "-c", "chown 1000:1000 /meta /data && chmod 0700 /meta /data"]

  # Gives the DMS (non-root) ownership of its data volume.
  dms-volume-init:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    volumes: [dms-data:/data]
    command: ["sh", "-c", "chown 1000:1000 /data"]

networks:
  default: {}
  nevli-db: { internal: true }
  dms-db: { internal: true }

volumes:
  secrets: {}
  gateway-data: {}
  gateway-config: {}
  nevli-db-data: {}
  dms-db-data: {}
  dms-data: {}
  garage-meta: {}
  garage-data: {}
