# OPTIONAL: lets Nevli list/restart this project's containers. Requires the host administrator to grant docker.sock,
# which is root-equivalent. Nevli only reaches it through a socket proxy whose allowlist permits exactly two calls:
#   GET  /containers/json             (list; Nevli filters on this compose project's label)
#   POST /containers/<id>/restart
# Everything else (create, exec, images, volumes, ...) is rejected by the proxy. Only the nevli container may connect.
# Enable: append ":compose.docker.yaml" to COMPOSE_FILE in .env.
services:
  docker-proxy:
    image: wollomatic/socket-proxy:1.13.2
    restart: unless-stopped
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=nevli
      - -allowGET=(/v1\.[0-9]+)?/containers/json
      - -allowPOST=(/v1\.[0-9]+)?/containers/[a-f0-9]{64}/restart
      - -allowhealthcheck
      - -watchdoginterval=300
      - -stoponwatchdog
      - -shutdowngracetime=5
    # root only to open the root-owned socket (works whatever the host's docker gid); no capabilities at all.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [docker-proxy]
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  nevli:
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
    networks: [default, nevli-db, docker-proxy]
    depends_on:
      docker-proxy: { condition: service_healthy }

networks:
  docker-proxy: { internal: true }
